const lineChart=(values,{color="#1599a1",min=23,max=27,labels=true}={})=>{let w=600,h=230,p={l:36,r:12,t:12,b:28},pw=w-p.l-p.r,ph=h-p.t-p.b;let points=values.map((v,i)=>[p.l+i*pw/(values.length-1),p.t+(max-v)/(max-min)*ph]);let line=points.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");let area=line+` L ${points.at(-1)[0]} ${p.t+ph} L ${points[0][0]} ${p.t+ph} Z`;let grid=[0,1,2,3,4].map(i=>{let y=p.t+i*ph/4,val=(max-i*(max-min)/4).toFixed(1);return `<line x1="${p.l}" y1="${y}" x2="${w-p.r}" y2="${y}" stroke="#e8eff3" stroke-dasharray="3 5"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" fill="#8399a6" font-size="10">${val}</text>`}).join("");let xlabels=labels?[0,3,6,9,12,14].map(i=>`<text x="${points[i][0]}" y="${h-7}" text-anchor="middle" fill="#8399a6" font-size="10">Day ${i+1}</text>`).join(""):"";return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Illustrative sample temperature trend">${grid}${xlabels}<path d="${area}" fill="${color}" opacity=".10"/><path d="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points.filter((_,i)=>i%3===0||i===points.length-1).map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`).join("")}</svg>`};
const barChart=(data)=>`<svg class="bar-chart" viewBox="0 0 440 190" preserveAspectRatio="none" role="img" aria-label="Fictional fisheries indices">${[0,25,50,75,100].map(v=>{let y=160-v*1.3;return `<line x1="80" y1="${y}" x2="426" y2="${y}" stroke="#e8eff3" stroke-dasharray="3 4"/><text x="69" y="${y+4}" text-anchor="end" fill="#8299a6" font-size="10">${v}</text>`}).join("")}${data.map((d,i)=>{let y=14+i*31;return `<text x="2" y="${y+13}" fill="#607c8e" font-size="10">${d[0]}</text><rect x="80" y="${y}" width="${d[1]*3.25}" height="17" rx="4" fill="#6b8ed3" opacity=".9"/><text x="${88+d[1]*3.25}" y="${y+12}" fill="#426179" font-size="10">${d[1]}</text>`}).join("")}</svg>`;
const donut=(data,size=160)=>{let r=51,c=2*Math.PI*r,offset=0;let arcs=data.map(d=>{let len=c*d[1]/100,s=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${d[2]}" stroke-width="19" stroke-dasharray="${Math.max(0,len-2)} ${c-len+2}" stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)"/>`;offset+=len;return s}).join("");return `<svg class="donut-svg" viewBox="0 0 160 160" role="img" aria-label="Illustrative biodiversity mix">${arcs}<text x="80" y="77" text-anchor="middle" fill="#18364b" font-size="20" font-weight="750">100%</text><text x="80" y="94" text-anchor="middle" fill="#8096a4" font-size="9">sample mix</text></svg>`};
const legend=(data)=>`<div class="legend">${data.map(d=>`<div class="legend-row"><span><i style="background:${d[2]}"></i>${d[0]}</span><b>${d[1]}%</b></div>`).join("")}</div>`;
const icon=(name)=>{const paths={temp:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z"/><path d="M12 12v6"/>',drop:'<path d="M12 3s7 8 7 12a7 7 0 0 1-14 0c0-4 7-12 7-12Z"/>',fish:'<path d="M3 12s4-6 10-6c3 0 5 2 6 6-1 4-3 6-6 6-6 0-10-6-10-6Z"/><path d="m19 12 3-4v8l-3-4Z"/>',leaf:'<path d="M20 4c-8 0-14 3-14 10a6 6 0 0 0 6 6c7 0 10-8 8-16Z"/><path d="M4 21c3-6 7-9 12-12"/>',wind:'<path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M4 16h7"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',spark:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/>'};return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.spark}</svg>`};
const stat=(ico,label,value,unit,delta,tone="cyan")=>`<article class="stat"><div class="stat-top"><div class="stat-icon ${tone}">${icon(ico)}</div><span class="pill">Sample</span></div><div class="stat-label">${label}</div><div class="stat-value">${value}<small>${unit}</small></div><div class="stat-foot"><span class="delta ${tone==="orange"?"amber":""}">${delta}</span><span>illustrative change</span></div></article>`;
const banner=(title="Prototype mode",message="All metrics, charts and insights are illustrative sample data. No live marine data feeds or AI model are connected.")=>`<div class="banner"><div class="banner-icon">${icon("spark")}</div><div><b>${title}</b><p>${message}</p></div></div>`;
const cardHead=(title,desc,tag="Sample data")=>`<div class="card-head"><div><h3>${title}</h3><p>${desc}</p></div><span class="mini-tag">${tag}</span></div>`;
const oceanMap=()=>`<div class="map"><svg viewBox="0 0 600 250" role="img" aria-label="Illustrative ocean observation map"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#b5dce4" stroke-width=".7"/></pattern><radialGradient id="glow"><stop stop-color="#8ad5dd" stop-opacity=".7"/><stop offset="1" stop-color="#d8f1f5" stop-opacity="0"/></radialGradient></defs><rect width="600" height="250" fill="url(#grid)"/><rect width="600" height="250" fill="url(#glow)"/><g fill="#c4dce2" stroke="#9cc6d0" stroke-width="1.4"><path d="M0 0h132l19 23-15 20 21 22-29 24 5 27-30 18-11 27-25 10-18 25-21 2L0 223Z"/><path d="M600 0h-75l-17 24 13 22-23 17 8 24-19 21 22 19-5 28 25 13 9 23 25 12 12 18 25 4Z"/></g><g fill="none" stroke="#4baeb8" stroke-width="1.5" opacity=".65"><path d="M175 67c72-48 133 54 210 7s105-2 160 37"/><path d="M160 153c80-43 139 51 220 7s115 3 163 35"/></g>${[[210,79],[301,115],[385,72],[433,157],[265,189],[492,112],[354,216]].map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="11" fill="#1599a1" opacity=".13"/><circle cx="${x}" cy="${y}" r="4" fill="#087f8c"/><circle cx="${x}" cy="${y}" r="1.4" fill="#fff"/></g>`).join("")}<g fill="#517c8e" font-size="9"><text x="198" y="64">OBS-01</text><text x="311" y="104">OBS-02</text><text x="394" y="61">OBS-03</text><text x="442" y="148">OBS-04</text></g></svg><div class="map-caption">${icon("eye")} Example observation locations · not geospatially accurate</div></div>`;
function overview(){return `<section class="hero"><div><div class="eyebrow"><span></span> MARINE DATA EXPLORER</div><h1>Ocean intelligence,<br><span>connected.</span></h1><p class="subtitle">A unified view of ocean conditions, fisheries and marine biodiversity.</p></div><div class="hero-actions"><span class="pill">● Prototype · Sample data</span><button class="btn" onclick="window.print()">⇩ Export view</button></div></section>${banner()}<div class="section-head"><div><h2>Marine overview</h2><p>Illustrative snapshot · not current ocean measurements</p></div><button class="link-btn" data-goto="Ocean conditions">Explore data ↗</button></div><div class="stats">${stat("temp","Sea surface temperature","25.8","°C","+0.4°")}${stat("drop","Dissolved oxygen","6.2","mg/L","−0.2","blue")}${stat("fish","Fisheries index","72","/100","+3.1%","green")}${stat("leaf","Species observations","1,284","","+8.2%","orange")}</div><div class="grid-main"><section class="card">${cardHead("Ocean temperature trend","Illustrative daily sample series · °C","15 sample points")}${lineChart(tempData)}<div class="chart-foot"><span class="chart-key"><i class="key-line"></i>Sample temperature</span><span>Fictional values</span></div></section><section class="card">${cardHead("Observation map","Example spatial overview","Illustrative")}${oceanMap()}<div class="map-foot"><span><i class="dot"></i>7 sample points plotted</span><span>Not a real location</span></div></section></div><div class="grid-bottom"><section class="card">${cardHead("Fisheries index by group","Illustrative relative index · 0–100")}${barChart(fishData)}<div class="chart-foot"><span>Fictional category indices</span></div></section><section class="card">${cardHead("Biodiversity composition","Illustrative observation mix")}<div class="donut-wrap">${donut(mix)}${legend(mix)}</div><div class="chart-foot"><span>Sample percentages only</span></div></section><section class="card insight-preview">${cardHead("Sample insight","Illustrative interpretation","Not AI-generated")}<div class="sample-insight"><div class="spark-icon">${icon("spark")}</div><div><span class="pill">Manual example</span><h4>Temperature trend to review</h4><p>The sample series trends upward overall. A real system would verify this against source data and regional baselines.</p></div></div><button class="full-btn" data-goto="AI insights">Explore insight examples ↗</button></section></div>`}
function conditions(){return `<section class="page-title"><div class="eyebrow"><span></span> OCEANOGRAPHY</div><h1>Ocean conditions</h1><p class="subtitle">Explore illustrative environmental measurements and trends.</p></section>${banner("Sample data only","These values are fictional demonstration data, not live readings or a real location forecast.")}<div class="stats three">${stat("temp","Sea surface temperature","25.8","°C","+0.4°")}${stat("drop","Dissolved oxygen","6.2","mg/L","−0.2","blue")}${stat("wind","Wind speed","14.2","km/h","+1.8","orange")}</div><div class="split"><section class="card">${cardHead("Temperature trend","Fictional daily series · °C","Sample")}${lineChart(tempData,{min:23,max:27})}<div class="chart-foot"><span>Illustrative values only</span></div></section><section class="card">${cardHead("Measurement guide","What these indicators mean","Reference")}<div class="guide"><div class="guide-icon">${icon("temp")}</div><div><b>Sea surface temperature</b><p>Can help describe ocean heat patterns and seasonal variability.</p></div></div><div class="guide"><div class="guide-icon">${icon("drop")}</div><div><b>Dissolved oxygen</b><p>Important for marine organisms and ecosystem health.</p></div></div><div class="guide"><div class="guide-icon">${icon("wind")}</div><div><b>Wind speed</b><p>Affects surface conditions and local ocean processes.</p></div></div></section></div>`}
function fisheries(){return `<section class="page-title"><div class="eyebrow"><span></span> FISHERIES INTELLIGENCE</div><h1>Fisheries</h1><p class="subtitle">A demonstration view of relative fisheries indicators and example records.</p></section>${banner("Not population estimates","Illustrative indices are not real catch statistics or scientific fish stock assessments.")}<div class="stats three">${stat("fish","Relative fishery index","72","/100","+3.1%","green")}${stat("database","Example records","248","","demo","blue")}${stat("eye","Groups shown","5","","demo","orange")}</div><div class="split"><section class="card">${cardHead("Relative index by group","Fictional values · not catch volume","Sample")}${barChart(fishData)}<div class="chart-foot"><span>Indices are not population estimates</span></div></section><section class="card">${cardHead("Interpretation notes","Read these indicators carefully","Guidance")}<div class="guide"><div class="guide-icon">${icon("fish")}</div><div><b>Catch is not stock size</b><p>Catch depends on fishing effort, season, regulations and equipment as well as abundance.</p></div></div><div class="guide"><div class="guide-icon">${icon("database")}</div><div><b>Use historical context</b><p>Compare consistent time periods and methods before inferring a trend.</p></div></div><div class="guide"><div class="guide-icon">${icon("spark")}</div><div><b>Validate before decisions</b><p>Real stock assessments require suitable data and scientific methods.</p></div></div></section></div>`}
function biodiversity(){return `<section class="page-title"><div class="eyebrow"><span></span> MARINE LIFE</div><h1>Marine biodiversity</h1><p class="subtitle">Explore a fictional composition of species observations for the demo.</p></section>${banner("Illustrative observations","The counts and percentages below are sample values, not a real survey or biodiversity assessment.")}<div class="stats three">${stat("eye","Species observations","1,284","","+8.2%")}${stat("leaf","Example groups","4","","demo","green")}${stat("database","Study areas","7","","demo","orange")}</div><div class="split"><section class="card">${cardHead("Observation mix","Illustrative share by broad group","Sample")}<div class="biodiv">${donut(mix)}<div class="bio-legend">${mix.map(d=>`<div><i style="background:${d[2]}"></i><span><b>${d[0]}</b><small>Illustrative category</small></span><strong>${d[1]}%</strong></div>`).join("")}</div></div></section><section class="card">${cardHead("Why biodiversity data matters","Context for real analysis","Guidance")}<div class="guide"><div class="guide-icon">${icon("leaf")}</div><div><b>Monitor changes</b><p>Consistent observations can help reveal shifts in species occurrence over time.</p></div></div><div class="guide"><div class="guide-icon">${icon("eye")}</div><div><b>Include location and effort</b><p>Counts can be affected by sampling effort, reporting gaps and location bias.</p></div></div><div class="guide"><div class="guide-icon">${icon("database")}</div><div><b>Preserve provenance</b><p>Retain source, date, taxonomy and licensing information for every record.</p></div></div></section></div>`}
const insightItems=[{type:"Ocean conditions",title:"Upward temperature pattern in sample series",body:"The illustrative values trend upward overall. A real workflow would compare validated observations against regional and seasonal baselines.",next:"Check source data, seasonality and measurement consistency."},{type:"Fisheries",title:"Sample index varies between groups",body:"The demo indices differ by category. This does not establish population changes, overfishing or stock health.",next:"Connect standardized catch and effort records before drawing conclusions."},{type:"Biodiversity",title:"Observation mix is uneven",body:"The fictional sample distribution contains different shares across broad groups. It is not evidence of ecosystem dominance.",next:"Account for sampling effort, taxonomy and reporting bias."}];
function insights(){return `<section class="page-title"><div class="eyebrow"><span></span> ANALYTICS LAB</div><h1>AI insights</h1><p class="subtitle">Example insight cards showing how a future analytics layer might communicate findings.</p></section>${banner("These are not AI outputs","All examples are manually written from fictional sample values. No AI model is connected in this prototype.")}<div class="filter-row"><label>${icon("spark")} Insight examples</label><select id="insightFilter" aria-label="Filter insight examples"><option>All examples</option><option>Ocean conditions</option><option>Fisheries</option><option>Biodiversity</option></select></div><div class="insights" id="insightCards">${renderInsightCards("All examples")}</div><div class="future">${icon("spark")}<div><b>Future AI layer</b><p>A production version could use validated datasets and evaluated models for anomaly detection or forecasting. Model selection, confidence reporting and domain validation are still required.</p></div></div>`}
function renderInsightCards(filter){return insightItems.filter(x=>filter==="All examples"||x.type===filter).map((x,i)=>`<article class="card insight-card"><div class="insight-top"><div class="guide-icon">${icon("spark")}</div><span class="insight-type">${x.type}</span><span class="pill">Illustrative</span></div><h3>${x.title}</h3><p>${x.body}</p><div class="next-step"><b>Potential next step</b><span>${x.next}</span></div><div class="chart-foot" style="margin-top:13px"><span>Static demo example</span><span>Example ${i+1}</span></div></article>`).join("")}
const pages={"Overview":overview,"Ocean conditions":conditions,"Fisheries":fisheries,"Biodiversity":biodiversity,"AI insights":insights};
let active="Overview";
function go(page){if(!pages[page])return;active=page;document.getElementById("crumb").textContent=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=pages[page]();document.getElementById("search").value="";document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.add("hidden");window.scrollTo({top:0,behavior:"smooth"});const filter=document.getElementById("insightFilter");if(filter)filter.addEventListener("change",()=>document.getElementById("insightCards").innerHTML=renderInsightCards(filter.value))}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});
document.getElementById("content").addEventListener("click",e=>{const b=e.target.closest("[data-goto]");if(b)go(b.dataset.goto)});
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();let note=document.querySelector(".search-note");if(note)note.remove();if(!q)return;const match=Object.keys(pages).find(p=>p.toLowerCase().includes(q));if(match){go(match);document.getElementById("search").value=q}else{const n=document.createElement("div");n.className="search-note";n.textContent='Search this prototype by page name: try “ocean”, “fisheries”, “biodiversity” or “AI insights”.';document.getElementById("content").prepend(n)}});
document.getElementById("openSidebar").addEventListener("click",()=>{document.getElementById("sidebar").classList.add("open");document.getElementById("scrim").classList.remove("hidden")});
document.getElementById("closeSidebar").addEventListener("click",()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.add("hidden")});
document.getElementById("scrim").addEventListener("click",()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.add("hidden")});
go("Overview");
</script>
</body>
</html>
